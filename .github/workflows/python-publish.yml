name: Publish

# Release flow: push a tag like `v0.1.0`, and the workflow builds, verifies
# the version matches the package's __version__, publishes to PyPI via
# trusted publishing (with Sigstore + PEP 740 attestations), and drafts a
# GitHub Release with the artifacts attached.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: write      # create GitHub Releases
  id-token: write      # PyPI trusted publishing + Sigstore
  attestations: write  # generate build attestations

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Resolve version
        id: resolve
        run: |
          set -euo pipefail
          ref="${{ inputs.tag || github.ref_name }}"
          tag_version="${ref#v}"
          pkg_version="$(uv run python -c 'import synecdoche; print(synecdoche.__version__)')"
          echo "tag_version=$tag_version"
          echo "pkg_version=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $ref does not match package __version__ ($pkg_version). Bump src/synecdoche/__init__.py and pyproject.toml, re-tag, and push."
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

      - name: Build sdist + wheel
        run: uv build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/synecdoche/${{ needs.build.outputs.version }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing + PEP 740 attestation)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true

  release:
    needs: [build, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: v${{ needs.build.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
