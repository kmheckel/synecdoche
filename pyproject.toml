[project]
name = "synecdoche"
version = "0.2.0"
description = "HyperNetworks and compressed weight representations for JAX / Flax NNX."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "kmheckel" },
]
keywords = [
    "jax",
    "flax",
    "nnx",
    "hypernetwork",
    "hypernetworks",
    "indirect-encoding",
    "low-rank",
    "compression",
    "neuroevolution",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4.34",
    "flax>=0.10.0",
]

[project.optional-dependencies]
# Lazy, never-materialised weights via quax multiple dispatch (LoRA-style).
quax = ["quax>=0.2.0"]

[project.urls]
Homepage = "https://github.com/kmheckel/synecdoche"
Repository = "https://github.com/kmheckel/synecdoche"
Issues = "https://github.com/kmheckel/synecdoche/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synecdoche"]

[tool.hatch.build.targets.sdist]
include = [
    "src/synecdoche",
    "README.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific
]
ignore = [
    "E501", # line length (ruff format handles it)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
