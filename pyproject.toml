[project]
name = "synecdoche"
version = "0.1.0"
description = "JIT AI code synthesis and execution — a functional paradigm for LLM-backed functions."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "kmheckel" },
]
keywords = [
    "llm",
    "ai",
    "code-synthesis",
    "sandbox",
    "pydantic-ai",
    "mcp",
    "agents",
    "jit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2.9",
    "pydantic-ai>=1.0",
    "pydantic-monty>=0.0.16",
    "fastmcp>=3.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
anthropic = ["pydantic-ai[anthropic]>=1.0"]
openai = ["pydantic-ai[openai]>=1.0"]
logfire = ["logfire>=3.0"]
all = [
    "pydantic-ai[anthropic,openai,google]>=1.0",
    "logfire>=3.0",
]

[project.scripts]
synecdoche = "synecdoche.cli:main"

[project.urls]
Homepage = "https://github.com/kmheckel/synecdoche"
Repository = "https://github.com/kmheckel/synecdoche"
Issues = "https://github.com/kmheckel/synecdoche/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synecdoche"]

[tool.hatch.build.targets.sdist]
include = [
    "src/synecdoche",
    "README.md",
    "LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific
]
ignore = [
    "E501", # line length (ruff format handles it)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
"src/synecdoche/prompts/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: tests that hit real model APIs (skipped by default unless ANTHROPIC_API_KEY is set)",
]
